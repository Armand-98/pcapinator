[project]
name = "pcapinator"
version = "0.1.0"
description = "Network threat hunting for packet captures: C2 beaconing, DNS tunneling, DGA and scan detection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Armand Zavala" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/Armand-98/pcapinator"
Repository = "https://github.com/Armand-98/pcapinator"
Issues = "https://github.com/Armand-98/pcapinator/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pcapinator = "pcapinator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
